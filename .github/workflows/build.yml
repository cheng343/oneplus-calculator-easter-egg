name: Build optimized APK

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - THIRD_PARTY_NOTICES.txt
      - APACHE-2.0.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out module source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Initialize Android SDK on GitHub
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages on GitHub
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Prepare signing key from GitHub Actions Secret
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: python3 .ci/prepare-signing.py

      - name: Compile against modern API 101 on GitHub
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -PcompileApiBaseline=101.0.1 :app:assembleRelease 2>&1 | tee api101-build.log

      - name: Compile, package and lint against API 102 on GitHub
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease :app:lintRelease 2>&1 | tee build.log

      - name: Verify signed APK and module metadata
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$apk"
          python3 .ci/check-apk.py "$apk"
          mkdir -p deliverables
          cp "$apk" 'deliverables/oneplus-easter-egg-0.1.0.apk'
          cd deliverables
          sha256sum *.apk > SHA256SUMS.txt
          printf 'Source commit: %s\nGitHub run: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > BUILD.txt

      - name: Upload installable optimized APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: oneplus-easter-egg-release
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build and lint diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-diagnostics
          path: |
            build.log
            api101-build.log
            app/build/reports/lint-results-release.*
            app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 14
